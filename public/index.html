<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOE Asistan</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 400px; background: #1e1e1e; border-radius: 10px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #chatBox { height: 300px; overflow-y: auto; border: 1px solid #333; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .message { margin-bottom: 10px; padding: 8px; border-radius: 5px; }
        .user-msg { background: #007bff; text-align: right; }
        .moe-msg { background: #28a745; text-align: left; }
        .error-msg { background: #dc3545; text-align: center; }
        .input-area { display: flex; }
        #userInput { flex: 1; padding: 10px; border: none; border-radius: 5px 0 0 5px; outline: none; }
        #sendBtn { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 0 5px 5px 0; cursor: pointer; }
    </style>
</head>
<body>

<div class="chat-container">
    <div id="chatBox"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="MOE'ye bir şeyler yaz...">
        <button id="sendBtn" onclick="mesajGonder()">Gönder</button>
    </div>
</div>

<script>
async function mesajGonder() {
    const inputElement = document.getElementById('userInput');
    const chatBox = document.getElementById('chatBox');
    const mesajMetni = inputElement.value.trim();

    if (!mesajMetni) return;

    // Kullanıcının mesajını ekrana yaz
    chatBox.innerHTML += `<div class="message user-msg">${mesajMetni}</div>`;
    inputElement.value = '';
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
        // Vercel'deki server.js'e istek atıyoruz
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ message: mesajMetni })
        });

        const data = await response.json();

        if (response.ok) {
            chatBox.innerHTML += `<div class="message moe-msg">${data.reply}</div>`;
        } else {
            chatBox.innerHTML += `<div class="message error-msg">Hata: ${data.reply || 'Sunucu hatası!'}</div>`;
        }
    } catch (error) {
        console.error("İstek hatası:", error);
        chatBox.innerHTML += `<div class="message error-msg">Hata: Sunucuya bağlanılamadı!</div>`;
    }

    chatBox.scrollTop = chatBox.scrollHeight;
}

// Enter tuşuna basınca da göndersin
document.getElementById('userInput').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
        mesajGonder();
    }
});
</script>

</body>
</html>
