<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS OS - MOE AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0f1d;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .chat-container {
            width: 450px;
            height: 85vh;
            background: rgba(16, 24, 48, 0.95);
            border: 2px solid #00d2ff;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #0f1a30;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 1px;
            border-bottom: 2px solid #00d2ff;
            text-transform: uppercase;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        /* Scrollbar Özelleştirme */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #00d2ff;
            border-radius: 3px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.4;
            font-size: 0.95rem;
            word-wrap: break-word;
        }
        .user-message {
            background: #0056b3;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            box-shadow: 0 4px 10px rgba(0, 86, 179, 0.3);
        }
        .moe-message {
            background: #1e293b;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid rgba(0, 210, 255, 0.2);
        }
        .error-message {
            background: #7f1d1d;
            color: #fca5a5;
            align-self: center;
            text-align: center;
            border: 1px solid #ef4444;
            max-width: 90%;
        }
        .chat-input-area {
            padding: 15px;
            background: #0f1a30;
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(0, 210, 255, 0.2);
        }
        .chat-input-area input {
            flex: 1;
            background: #0a0f1d;
            border: 1px solid #00d2ff;
            padding: 12px;
            border-radius: 8px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }
        .chat-input-area input:focus {
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }
        .chat-input-area button {
            background: #00d2ff;
            color: #0a0f1d;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }
        .chat-input-area button:hover {
            background: #0099cc;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
            color: white;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">MOE INTELLECT - ONLINE</div>
    <div class="chat-messages" id="chatBox"></div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Sisteme bir emir verin veya mesaj yazın...">
        <button id="sendBtn" onclick="mesajGonder()">Gönder</button>
    </div>
</div>

<script>
async function mesajGonder() {
    const inputElement = document.getElementById('userInput');
    const chatBox = document.getElementById('chatBox');
    const mesajMetni = inputElement.value.trim();

    if (!mesajMetni) return;

    // 1. Kullanıcının mesajını ekrana şıkça yaz
    chatBox.innerHTML += `<div class="message user-message">${mesajMetni}</div>`;
    inputElement.value = '';
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
        // 2. Vercel sunucusuna (server.js) isteği güvenle uçuruyoruz
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ message: mesajMetni })
        });

        const data = await response.json();

        // 3. Sunucudan gelen cevabı ekrana bas
        if (response.ok) {
            chatBox.innerHTML += `<div class="message moe-message">${data.reply}</div>`;
        } else {
            chatBox.innerHTML += `<div class="message error-message">Hata: ${data.reply || 'Sistem hatası meydana geldi!'}</div>`;
        }
    } catch (error) {
        console.error("İstek hatası:", error);
        chatBox.innerHTML += `<div class="message error-message">Hata: Sunucu bağlantısı kesildi!</div>`;
    }

    chatBox.scrollTop = chatBox.scrollHeight;
}

// Enter tuşu entegrasyonu
document.getElementById('userInput').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') {
        mesajGonder();
    }
});
</script>

</body>
</html>
